<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#00d4a8"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon mark: dark rounded square -->
  <rect x="2" y="2" width="52" height="52" rx="12" ry="12" fill="#060b18"/>
  <rect x="2" y="2" width="52" height="52" rx="12" ry="12" fill="none" stroke="#00d4a8" stroke-width="1.2" opacity="0.5"/>

  <!-- Lightning bolt inside icon -->
  <polygon points="
    33,8
    21,8
    21,26
    29,24
    15,48
    27,48
    27,30
    19,32
  " fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Wordmark: "Cash" white + "Call" teal -->
  <text x="68" y="36" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Cash</text>
  <text x="130" y="36" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700" fill="#00d4a8" letter-spacing="-0.5">Call</text>

  <!-- Tagline dot -->
  <circle cx="64" cy="40" r="2.5" fill="#00d4a8" opacity="0"/>
</svg>
