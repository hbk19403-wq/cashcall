<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Outer circle dark -->
  <circle cx="80" cy="80" r="76" fill="#1a1f3a"/>
  <circle cx="80" cy="80" r="76" fill="none" stroke="#6b7280" stroke-width="2"/>
  <!-- Petal mandala - 8 petals -->
  <g transform="translate(80,80)">
    <ellipse rx="18" ry="36" fill="#4b5563" opacity="0.7"/>
    <ellipse rx="18" ry="36" fill="#4b5563" opacity="0.7" transform="rotate(45)"/>
    <ellipse rx="18" ry="36" fill="#4b5563" opacity="0.7" transform="rotate(90)"/>
    <ellipse rx="18" ry="36" fill="#4b5563" opacity="0.7" transform="rotate(135)"/>
    <!-- Inner petals red -->
    <ellipse rx="10" ry="22" fill="#dc2626" opacity="0.85"/>
    <ellipse rx="10" ry="22" fill="#dc2626" opacity="0.85" transform="rotate(45)"/>
    <ellipse rx="10" ry="22" fill="#dc2626" opacity="0.85" transform="rotate(90)"/>
    <ellipse rx="10" ry="22" fill="#dc2626" opacity="0.85" transform="rotate(135)"/>
    <!-- Center gem -->
    <circle r="12" fill="#991b1b"/>
    <circle r="7" fill="#ef4444"/>
    <circle r="3" fill="#fca5a5"/>
  </g>
  <!-- Outer ring overlay -->
  <circle cx="80" cy="80" r="44" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="80" cy="80" r="60" fill="none" stroke="#4b5563" stroke-width="1"/>
</svg>
